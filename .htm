<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site da Jane</title>
</head>
<body>
    <div class="fundo"></div>


    <header>
        <div class="titulos">
            <p>QUEM SOMOS</p>
            <p>SALÃO</p>
            <p>MEDIA</p>
            <p>LOJA</p>
            <p>PROFISSIONAIS</p>
        </div>
    </header>

    <nav class="navegacao">
        <div class="titulo-nav">
            <p>AGENDE UM HORÁRIO EM POUCOS CLIQUES</p>
        </div>
    <div class="btn">
        <button id="btnAgendar" onclick="btnAgenda()">
        AGENDAR
        </button>
    </div>

    <div class="agendamento" id="agendamento" hidden>

        <!-- ETAPA 1: NOME -->
        <div class="etapa" id="etapa-nome">
            <label class="agendamento-titulo" for="inputNome">SEU NOME:</label>
            <input type="text" id="inputNome" placeholder="Digite seu nome completo">
            <div class="agendamento-botoes">
                <button class="btn-agendamento" onclick="confirmarNome()">CONFIRMAR</button>
            </div>
        </div>

        <!-- ETAPA 2: ESCOLHA DO CORTE -->
        <div class="etapa" id="etapa-corte" hidden>
            <div class="agendamento-botoes">
                <button class="btn-agendamento" onclick="confirmarCorte()">CONFIRMAR</button>
                <button class="btn-agendamento btn-voltar" onclick="voltarParaNome()">VOLTAR</button>
            </div>

            <h3 class="agendamento-titulo">ESCOLHA O TIPO DE CORTE</h3>

            <div class="grupo-agendamento" id="grupo-agendamento">
                <!-- cards gerados dinamicamente via script.js -->
            </div>
        </div>

        <!-- ETAPA 3: RESUMO FINAL -->
        <div class="etapa" id="etapa-resumo" hidden>
            <h3 class="agendamento-titulo" id="resumoTexto"></h3>
            <div class="agendamento-botoes">
                <button class="btn-agendamento" onclick="reiniciarAgendamento()">NOVO AGENDAMENTO</button>
            </div>
        </div>

    </div>
    </nav>

    <main class="container-principal">
        <aside class="coluna-esquerda"></aside>

        <article class="container-secundario">
                <div class="grupo">
                    <div class="Kratos">
                        <img src="./imgs/Rectangle 9.png" alt="kratros">                 
                        <p>
                            <span class="longbob">Long Bob</span>    
                        </p>
                        <p>
                        <span class="longbob">R$35.00</span>
                    </p>
                    </div>

                    <div class="dante">
                        <img src="./imgs/Rectangle 11.png" alt="Dante">
                        <p>
                            <span class="chanel">Chanel de Bico</span>    
                        </p>
                        <p>
                        <span class="chanel">R$25.00</span>
                    </p>
                    </div>

                    <div class="claire">
                        <img src="./imgs/Rectangle 8.png" alt="Claire">
                        <p>
                            <span class="borboleta">Borboleta</span>    
                        </p>
                        <p>
                        <span class="borboleta">R$45.00</span>
                    </p>
                    </div>

                    <div class="leon">
                        <img src="./imgs/Rectangle 6.png" alt="Leon">
                        <p>
                            <span class="pixiecut">PixieCut</span>    
                        </p>
                        <p>
                        <span class="pixiecut">R$15.00</span>
                    </p>
                    </div>

                    <div class="ada">
                        <img src="./imgs/Rectangle 7.png" alt="Ada">
                        <p>
                            <span class="shaghair">ShagHair</span>    
                        </p>
                        <p>
                        <span class="shaghair">R$25.00</span>
                    </p>
                    </div>

                    <div class="ariana">
                        <img src="./imgs/Rectangle 10.png" alt="Ariana">
                        <p>
                            <span class="camadas">Camadas Longas</span>    
                        </p>
                        <p>
                        <span class="camadas">R$50.00</span>
                    </p>
                    </div>
                </div>
        </article>

        <aside class="coluna">
            <div class="coluna-track" id="coluna-track">
                <!-- as imagens são inseridas automaticamente pelo script.js -->
            </div>
        </aside>
    </main>

    <footer class="credito">
        <div class="carrosel-container">
            <div class="carrosel-track" id="carrosel-track">
                
            </div>
        </div>
    </footer>


    
    <script src="./script.js"></script>
</body>
</html>
